version: '3.9'

services:
  # ─────────────────────────────────────────────
  # PostgreSQL — base de données locale
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: amda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: amda
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: S4HmEb69
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amda"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ─────────────────────────────────────────────
  # Redis — cache & queues
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: amda-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Backend AMDA
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amda-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:3003:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # ── URLs publiques ──
      API_URL: https://amda.159-223-162-195.nip.io
      FRONTEND_URL: https://amdabot.netlify.app
      ALLOWED_ORIGINS: https://amdabot.netlify.app,https://amda.159-223-162-195.nip.io,http://amda.159-223-162-195.nip.io
      # ── Database & Redis ──
      DATABASE_URL: postgresql://postgres:S4HmEb69@postgres:5432/amda
      REDIS_URL: redis://redis:6379
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # ── Paths ──
      WHATSAPP_SESSION_PATH: ./sessions
      UPLOADS_PATH: ./uploads
      LOG_LEVEL: info
      # ── JWT (à définir via .env) ──
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # ── Stripe (optionnel) ──
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      STRIPE_PRICE_ID_MONTHLY: ${STRIPE_PRICE_ID_MONTHLY:-price_placeholder_monthly}
      STRIPE_PRICE_ID_YEARLY: ${STRIPE_PRICE_ID_YEARLY:-price_placeholder_yearly}
      # ── Firebase (optionnel) ──
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      # ── Cloudinary (optionnel) ──
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_sessions:/app/sessions
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { if (r.statusCode !== 200) throw new Error(r.statusCode) })"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_sessions:
    driver: local
