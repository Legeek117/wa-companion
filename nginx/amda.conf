# ============================================================
# AMDA Backend - Nginx Configuration
# Domain: amda.159-223-162-195.nip.io
# Backend: http://host.docker.internal:3003
# ============================================================

# HTTP - Redirect to HTTPS + Certbot ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name amda.159-223-162-195.nip.io;

    # Certbot ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name amda.159-223-162-195.nip.io;

    # SSL Configuration - Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/amda.159-223-162-195.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amda.159-223-162-195.nip.io/privkey.pem;
    
    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Logs
    access_log /var/log/nginx/amda-access.log;
    error_log /var/log/nginx/amda-error.log;

    # Client body size (pour upload de médias WhatsApp)
    client_max_body_size 50M;

    # Proxy settings
    location / {
        proxy_pass http://host.docker.internal:3003;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support (pour Socket.io si utilisé)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
