# ============================================================
# AMDA Backend - Nginx Configuration (HTTP ONLY - pour générer le certificat)
# Domain: amda.159-223-162-195.nip.io
# Backend: http://172.17.0.1:3003
# ============================================================

# HTTP - Certbot ACME challenge + Proxy temporaire
server {
    listen 80;
    listen [::]:80;
    server_name amda.159-223-162-195.nip.io;

    # Certbot ACME challenge for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy vers le backend (temporaire, sera redirigé vers HTTPS après)
    location / {
        proxy_pass http://172.17.0.1:3003;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffering
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
